services:
  server:
    build:
      context: .
      target: final
    ports:
      - "8080:8080"
      - "9000:8080"
    environment:
      - ConnectionStrings__DBConnection=Server=${DB_SERVER:-db},${DB_PORT:-1433};Database=${DB_NAME:-StockManagementDb};User Id=${DB_USER:-sa};Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      - ASPNETCORE_ENVIRONMENT=Production
      - TokenKey=${TOKEN_KEY}
      - PasswordKey=${PASSWORD_KEY}
    volumes:
      - ./Logs:/app/Logs
    depends_on:
      db-init:
        condition: service_completed_successfully

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: stock-management-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U ${DB_USER:-sa} -P '${MSSQL_SA_PASSWORD}' -C -Q 'SELECT 1' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./init-db.sql:/init-db.sql
    entrypoint: >
      /bin/bash -c " /opt/mssql-tools18/bin/sqlcmd -S ${DB_SERVER:-db} -U ${DB_USER:-sa} -P '${MSSQL_SA_PASSWORD}' -C -i /init-db.sql "

volumes:
  mssql-data:

